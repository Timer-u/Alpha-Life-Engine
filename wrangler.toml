name = "alpha-life-engine"
main = "functions/api/[[route]].ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug", SESSION_DAYS = "7" }

# 每日 01:00 UTC（北京时间 09:00）检查策略演化器是否过期并发送提醒邮件
[triggers]
crons = ["0 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "alpha-life-dev"
database_id = "a491d7ba-045d-4303-a10b-ae25591e8164"

[env.development]
name = "alpha-life-engine"
vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug", SESSION_DAYS = "7" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "alpha-life-dev"
database_id = "a491d7ba-045d-4303-a10b-ae25591e8164"

# 生产域名占位符（routes）：部署到真实域名时把 pattern/zone_name 换成
# 实际值并保留注释供回溯。未配置 routes 时走 workers.dev 子域。
[env.production]
name = "alpha-life-engine"
# routes = [
#   { pattern = "alpha-life.example.cn/*", zone_name = "example.cn" }
# ]
vars = { ENVIRONMENT = "production", LOG_LEVEL = "info", SESSION_DAYS = "7" }

[env.production.triggers]
crons = ["0 1 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "alpha-life-prod"
database_id = "c79c0075-f608-4ced-9f70-1ca98698ee3e"
