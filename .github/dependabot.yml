version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
    assignees:
      - "Timer-u"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    groups:
      production-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    versioning-strategy: increase

  - package-ecosystem: "pip"
    directory: "/scripts/local_evolver"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "Timer-u"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
    assignees:
      - "Timer-u"
    open-pull-requests-limit: 5
    groups:
      actions-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
