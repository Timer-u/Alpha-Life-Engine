name: Daily Market Data Update

on:
  schedule:
    # 交易日 08:00 CST (00:00 UTC) — 取前一交易日数据
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  issues: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          pip install baostock pandas
          python -c "import baostock, pandas"

      - name: Install Node dependencies
        run: npm ci

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Download latest market data (BaoStock)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DEV_NAME: alpha-life-dev
          D1_PROD_NAME: alpha-life-prod
        run: |
          if [ "${{ github.event.inputs.env }}" == "development" ]; then
            npx tsx scripts/daily-market-update.ts --dev
          else
            npx tsx scripts/daily-market-update.ts --prod
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TODO(owner): wire a real email/webhook channel (e.g. Resend or ntfy).
          # Until then, surface a GitHub issue so a red job is not silently ignored.
          gh issue create \
            --title "Daily market data update failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled BaoStock market-data update failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
