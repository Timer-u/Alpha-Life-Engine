name: D1 Weekly Backup

# 生产 D1 每周导出为 workflow artifact（保留 8 周）。
# 需要在仓库 secrets 配置 CLOUDFLARE_API_TOKEN（D1 读权限）与
# CLOUDFLARE_ACCOUNT_ID；未配置时该 workflow 会失败并显式提示。

on:
  schedule:
    - cron: '0 18 * * 0' # 每周日 18:00 UTC（北京时间周一 02:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Export production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::secret CLOUDFLARE_API_TOKEN 未配置；D1 备份无法执行。" >&2
            exit 1
          fi
          npx wrangler d1 export alpha-life-prod --remote --env production --output=backup.sql

      - name: Row-count sanity check
        run: |
          echo "## D1 backup summary" >> $GITHUB_STEP_SUMMARY
          echo "- backup.sql size: $(du -h backup.sql | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- market_data rows: $(grep -c 'INSERT INTO market_data' backup.sql || true)" >> $GITHUB_STEP_SUMMARY
          echo "- transactions rows: $(grep -c 'INSERT INTO transactions' backup.sql || true)" >> $GITHUB_STEP_SUMMARY

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 56
